name: Branch Preview Deploy

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SAFE_NAME=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Fetch existing gh-pages
        run: git fetch origin gh-pages || true

      - name: Deploy MAIN branch to root
        if: steps.branch.outputs.branch == 'main'
        run: |
          mkdir -p deploy_output
          rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_output' --exclude='github-guide.html' ./ deploy_output/

      - name: Deploy OTHER branch to preview subfolder
        if: steps.branch.outputs.branch != 'main'
        run: |
          mkdir -p deploy_output

          # Restore root files from existing gh-pages
          git archive origin/gh-pages 2>/dev/null | tar -x -C deploy_output/ 2>/dev/null || true

          # Remove old preview of this branch
          rm -rf "deploy_output/preview-${{ steps.branch.outputs.name }}" 2>/dev/null || true

          # Copy branch files into preview subfolder
          mkdir -p "deploy_output/preview-${{ steps.branch.outputs.name }}"
          rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_output' ./ "deploy_output/preview-${{ steps.branch.outputs.name }}/"

      - name: Create previews listing page
        run: |
          cat > deploy_output/previews.html << 'LISTEOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Previews</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,Tahoma,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.c{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:48px 36px;max-width:500px;width:100%;text-align:center}h1{font-size:1.6rem;margin-bottom:20px}.l{display:block;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 20px;margin:10px 0;color:#fff;text-decoration:none;text-align:left}.l:hover{background:rgba(74,222,128,0.1)}.l b{color:#4ade80}.l small{opacity:0.5}</style></head><body><div class="c"><h1>📋 Branch Previews</h1>
          LISTEOF

          for dir in deploy_output/preview-*/; do
            [ -d "$dir" ] || continue
            FOLDER=$(basename "$dir")
            BRANCH_NICE=$(echo "$FOLDER" | sed 's/preview-//' | sed 's/-/\//g')
            FIRST_HTML=$(find "$dir" -maxdepth 1 -name "*.html" ! -name "github-guide.html" | sort | head -1)
            [ -z "$FIRST_HTML" ] && continue
            FIRST_HTML=$(basename "$FIRST_HTML")
            echo "<a class=\"l\" href=\"${FOLDER}/${FIRST_HTML}\">📦 <b>${BRANCH_NICE}</b><br><small>${FIRST_HTML}</small></a>" >> deploy_output/previews.html
          done

          echo "</div></body></html>" >> deploy_output/previews.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ steps.branch.outputs.branch }}"
