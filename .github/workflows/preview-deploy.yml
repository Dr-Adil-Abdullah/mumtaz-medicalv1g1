name: Branch Preview Deploy

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SAFE_NAME=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Fetch existing gh-pages
        run: |
          git fetch origin gh-pages || true

      - name: Copy MAIN branch to root (actual website)
        if: steps.branch.outputs.branch == 'main'
        run: |
          mkdir -p deploy_output

          # Copy main site files to ROOT of gh-pages
          rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_output' --exclude='github-guide.html' ./ deploy_output/

      - name: Copy OTHER branches to subfolder (preview)
        if: steps.branch.outputs.branch != 'main'
        run: |
          mkdir -p deploy_output

          # Restore existing root files from gh-pages
          if git show origin/gh-pages:index.html > /dev/null 2>&1; then
            git archive origin/gh-pages -- index.html about.html README.md netlify.toml 2>/dev/null | tar -x -C deploy_output/ 2>/dev/null || true
          fi

          # Copy branch files into subfolder
          mkdir -p "deploy_output/preview-${{ steps.branch.outputs.name }}"
          rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_output' ./ "deploy_output/preview-${{ steps.branch.outputs.name }}/"

      - name: Create preview index page
        run: |
          # Only create index if it doesn't exist (from main)
          if [ ! -f "deploy_output/index.html" ] || grep -q "Branch Previews" "deploy_output/index.html" 2>/dev/null; then

            cat > deploy_output/previews.html << 'HTMLEOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Mumtaz Medical — Branch Previews</title>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: 'Segoe UI', Tahoma, sans-serif;
                  background: linear-gradient(135deg, #0f172a, #1e293b);
                  color: #fff; min-height: 100vh;
                  display: flex; flex-direction: column;
                  align-items: center; justify-content: center; padding: 24px; }
                .card { background: rgba(255,255,255,0.06); backdrop-filter: blur(8px);
                  border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
                  padding: 48px 36px; max-width: 560px; width: 100%;
                  box-shadow: 0 12px 40px rgba(0,0,0,0.3); text-align: center; }
                h1 { font-size: 1.8rem; margin-bottom: 6px; }
                .sub { opacity: 0.5; font-size: 0.9rem; margin-bottom: 24px; }
                .link { display: block; background: rgba(255,255,255,0.08);
                  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
                  padding: 16px 24px; margin-bottom: 10px; color: #fff;
                  text-decoration: none; text-align: left; transition: all 0.2s; }
                .link:hover { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.3); }
                .link b { color: #4ade80; }
                .link small { opacity: 0.5; }
              </style>
            </head>
            <body><div class="card">
              <div style="font-size:2.5rem;margin-bottom:10px">🏥</div>
              <h1>Branch Previews</h1>
              <p class="sub">Test branches before merging</p>
          HTMLEOF

            for dir in deploy_output/preview-*/; do
              if [ -d "$dir" ]; then
                FOLDER=$(basename "$dir")
                BRANCH_NICE=$(echo "$FOLDER" | sed 's/preview-//' | sed 's/-/\//g')
                FIRST_HTML=$(find "$dir" -maxdepth 1 -name "*.html" ! -name "github-guide.html" | sort | head -1 | xargs basename 2>/dev/null)
                if [ -n "$FIRST_HTML" ]; then
                  echo "              <a class=\"link\" href=\"${FOLDER}/${FIRST_HTML}\">📦 <b>${BRANCH_NICE}</b><br><small>${FIRST_HTML}</small></a>" >> deploy_output/previews.html
                fi
              fi
            done

            cat >> deploy_output/previews.html << 'HTMLEOF'
            </div></body></html>
            HTMLEOF

          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ steps.branch.outputs.branch }}"
