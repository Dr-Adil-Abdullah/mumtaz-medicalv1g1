name: Branch Preview Deploy

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SAFE_NAME=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy_output/${{ steps.branch.outputs.name }}

          # Copy ALL files from the branch into the subfolder
          # Skip .git folder and the workflow file itself
          rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_output' ./ "deploy_output/${{ steps.branch.outputs.name }}/"

      - name: Checkout gh-pages to get existing branches
        run: |
          git fetch origin gh-pages || true
          mkdir -p existing
          if git show origin/gh-pages:index.html > /dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C existing
          fi

      - name: Build dynamic index page
        run: |
          cat > deploy_output/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mumtaz Medical — Branch Previews</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: 'Segoe UI', Tahoma, sans-serif;
                background: linear-gradient(135deg, #1e3a8a, #3b82f6);
                color: #fff;
                min-height: 100vh;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 24px;
              }
              .card {
                background: rgba(255,255,255,0.12);
                backdrop-filter: blur(8px);
                border: 1px solid rgba(255,255,255,0.25);
                border-radius: 20px; padding: 48px 36px;
                max-width: 560px; width: 100%;
                box-shadow: 0 12px 40px rgba(0,0,0,0.3);
                text-align: center;
              }
              h1 { font-size: 2rem; margin-bottom: 8px; }
              p { opacity: 0.8; margin-bottom: 24px; font-size: 1.05rem; }
              .link {
                display: block;
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 12px; padding: 16px 24px;
                margin-bottom: 12px; color: #fff;
                text-decoration: none; font-size: 1.1rem;
                transition: background 0.2s; text-align: left;
              }
              .link:hover { background: rgba(255,255,255,0.25); }
              .link .branch-name { font-weight: bold; }
              .link .pages { opacity: 0.6; font-size: 0.82rem; margin-top: 4px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div style="font-size:3rem;margin-bottom:12px">🏥</div>
              <h1>Mumtaz Medical</h1>
              <p>Branch Previews — click any branch to test it live</p>
          HTMLEOF

          # Find all branches in deploy_output and create links
          for dir in deploy_output/*/; do
            if [ -d "$dir" ]; then
              BRANCH_FOLDER=$(basename "$dir")
              # Find HTML files in this branch folder
              HTML_FILES=$(find "$dir" -maxdepth 1 -name "*.html" -exec basename {} \; | sort)
              LINK_ITEMS=""
              for f in $HTML_FILES; do
                LINK_ITEMS="$LINK_ITEMS $f"
              done
              if [ -n "$LINK_ITEMS" ]; then
                FIRST_FILE=$(echo "$HTML_FILES" | head -1)
                echo "              <a class=\"link\" href=\"${BRANCH_FOLDER}/${FIRST_FILE}\">" >> deploy_output/index.html
                echo "                <div class=\"branch-name\">📦 ${BRANCH_FOLDER}</div>" >> deploy_output/index.html
                echo "                <div class=\"pages\">Pages:${LINK_ITEMS}</div>" >> deploy_output/index.html
                echo "              </a>" >> deploy_output/index.html
              fi
            fi
          done

          cat >> deploy_output/index.html << 'HTMLEOF'
            </div>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy preview for ${{ steps.branch.outputs.branch }}"
