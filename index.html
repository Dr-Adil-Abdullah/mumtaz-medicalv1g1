<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ہماری ٹیم — پریکٹس ویب سائٹ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 2.2rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; line-height: 1.9; opacity: 0.95; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
    }
    .footer { margin-top: 28px; font-size: 0.85rem; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 خوش آمدید!</h1>
    <p>
      یہ ہماری ٹیم کی پہلی پریکٹس ویب سائٹ ہے۔<br />
      یہ صفحہ "AI ایجنٹ" نے بنایا ہے تاکہ آپ
      GitHub پر approve اور reject کرنا سیکھ سکیں۔
    </p>
    <span class="badge">✅ Feature: Homepage تیار ہے</span>
    <div class="footer">بنایا گیا: ہماری ٹیم کا ورک فلو ٹرائل</div>
  </div>
</body>
</html>
