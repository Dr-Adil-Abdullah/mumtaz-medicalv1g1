<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumtaz Medical — Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .emoji { font-size: 3.5rem; margin-bottom: 8px; }
    h1 { font-size: 2.6rem; margin-bottom: 14px; }
    p { font-size: 1.15rem; line-height: 1.9; opacity: 0.95; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #facc15;
      color: #422006;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
    }
    .footer { margin-top: 28px; font-size: 0.85rem; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">👨‍⚕️</div>
    <h1>Hi Doctor!</h1>
    <p>
      Welcome to Mumtaz Medical.<br />
      This page was built by the AI agent so you can practice
      approving and rejecting changes on GitHub.
    </p>
    <span class="badge">✅ Feature: Welcome Page Ready</span>
    <div class="footer">Built for our team workflow trial</div>
  </div>
</body>
</html>
